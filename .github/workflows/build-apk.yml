name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🛠️ Build Web Production Bundle
        run: npm run build

      - name: 🔄 Sync Capacitor Android Assets
        run: npx cap sync android

      - name: 🔧 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🤖 Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload APK Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: LR-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "LR Manager Android APK v1.0.0"
          body: |
            ### 🚛 LR Manager Mobile App (Android APK)
            Latest build generated automatically by GitHub Actions.
            
            - **App Name:** LR Manager
            - **Package ID:** com.biltybook.app
            - **Version:** 1.0.0 (Debug Build)
            - **Included Modules:** LR Management, 3D Truck Garage, Accounting & GST Center, Vehicle Hiring, Bilty PDF Maker.
            
            📲 **Download `app-debug.apk` directly from Assets below and install on your phone.**
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
