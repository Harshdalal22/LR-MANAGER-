steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/bilty-book/cloud-run-source-deploy/biltybook:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/bilty-book/cloud-run-source-deploy/biltybook:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/bilty-book/cloud-run-source-deploy/biltybook'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'biltybook'
      - '--image'
      - 'asia-south1-docker.pkg.dev/bilty-book/cloud-run-source-deploy/biltybook:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

images:
  - 'asia-south1-docker.pkg.dev/bilty-book/cloud-run-source-deploy/biltybook:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/bilty-book/cloud-run-source-deploy/biltybook:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
