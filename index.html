<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilty Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ssk-blue': '#1e3a8a',
              'ssk-red': '#dc2626',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideIn: {
                '0%': { opacity: '0', transform: 'translateX(-20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              biltyFlip: {
                '0%': { transform: 'rotateY(0deg)', transformOrigin: 'left' },
                '50%': { transform: 'rotateY(-90deg)', transformOrigin: 'left' },
                '100%': { transform: 'rotateY(-180deg)', transformOrigin: 'left', opacity: '0' },
              },
              truckBounce: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-2.5px)' },
              },
              truckBoost: {
                '0%': { transform: 'translateX(0) scale(1)' },
                '30%': { transform: 'translateX(10px) scale(1.05)' },
                '60%': { transform: 'translateX(-4px) scale(0.98)' },
                '100%': { transform: 'translateX(0) scale(1)' },
              },
              smokePuff: {
                '0%': { opacity: '0.8', transform: 'translate(0, 0) scale(0.5)' },
                '100%': { opacity: '0', transform: 'translate(-16px, -12px) scale(1.8)' },
              },
              roadDashes: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-25%)' },
              }
            },
            animation: {
              fadeInUp: 'fadeInUp 0.6s ease-out forwards',
              slideIn: 'slideIn 0.5s ease-out forwards',
              biltyFlip: 'biltyFlip 0.8s ease-in-out infinite',
              truckBounce: 'truckBounce 0.4s ease-in-out infinite',
              truckBoost: 'truckBoost 1s ease-in-out forwards',
              smokePuff: 'smokePuff 0.8s ease-out infinite',
              roadDashes: 'roadDashes 0.5s linear infinite',
            }
          },
        },
      }
    </script>
    <style>
      .clip-beam {
        clip-path: polygon(0% 40%, 100% 0%, 100% 100%, 0% 60%);
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #print-root, #print-root * {
          visibility: visible;
        }
        #print-root {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
        }
        .printable-area {
          border: none !important;
          box-shadow: none !important;
        }
        @page {
          size: A4;
          margin: 0;
        }
        .page-break {
          page-break-after: always;
        }
        .page-break:last-child {
          page-break-after: auto;
        }
      }
      /* Added for 3D UI feel */
      input:focus, textarea:focus, select:focus {
        transform: scale(1.02);
        box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.5);
        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      }
    </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  }
}
</script>
